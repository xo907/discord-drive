[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discorddrive"
dynamic = ["version"]
description = "An encrypted virtual drive (Windows / Linux) backed by a private Discord channel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "cryptography; sys_platform != 'win32'",
]

[project.scripts]
discorddrive = "discorddrive.cli:main"

[tool.setuptools]
packages = ["discorddrive", "discorddrive._vendor"]

[tool.setuptools.dynamic]
version = { attr = "discorddrive.__version__" }
